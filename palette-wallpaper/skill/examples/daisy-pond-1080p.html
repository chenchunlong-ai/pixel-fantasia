<!doctype html>
<!-- pixel-wallpaper {"format":1,"type":"wallpaper","loop":0} -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>雏菊水塘 · 1080P</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #16323c; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Daisy Pond 1080P — clear sunlit water seen from above, rendered on the GPU.
// The water is a real shader: three travelling wave trains bend the caustic coordinates, the
// caustic net is the classic iterated-sine-warp refraction pattern, murk patches cloud the top,
// ripple rings spread and fade, glints sparkle on the wave crests, and six SDF daisies drift
// and bob on the swell. Continuous evolution ("loop":0): the clock only advances while visible.
"use strict";
const dbg = (m) => { try { window.chrome && chrome.webview && chrome.webview.postMessage({ type: "dbg", src: "daisypond1080", ...m }); } catch (e) {} };
dbg({ boot: 1, vis: document.visibilityState });
addEventListener("error", (e) => dbg({ scriptError: String(e.message || e), at: String(e.filename || "").slice(-40) + ":" + e.lineno }));
const cvs = document.getElementById("c");
const gl = cvs.getContext("webgl", { antialias: false, alpha: false });
if (!gl) dbg({ gl: "FAIL: no webgl context" });
cvs.addEventListener("webglcontextlost", (e) => { e.preventDefault(); dbg({ gl: "context lost" }); });

const VERT = `
attribute vec2 p;
void main() { gl_Position = vec4(p, 0.0, 1.0); }
`;

const FRAG = `
precision highp float;
uniform vec2 R;      // canvas resolution
uniform float T;     // seconds, advanced only while visible
uniform float DPR;
uniform vec3 uMou;      // cursor: x, y (uv, y-up), agitation 0..1

float hash(vec2 q) {
  q = fract(q * vec2(234.34, 435.345));
  q += dot(q, q + 34.23);
  return fract(q.x * q.y);
}
float noise(vec2 q) {
  vec2 i = floor(q), f = fract(q);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash(i), b = hash(i + vec2(1, 0)), c = hash(i + vec2(0, 1)), d = hash(i + vec2(1, 1));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
float fbm(vec2 q) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 3; i++) { v += a * noise(q); q = q * 2.03 + vec2(11.7, 5.3); a *= 0.5; }
  return v;
}

// ---- the water height field: three travelling wave trains + a slow swell -------
// returns (height, dh/dx, dh/dy) so lighting and refraction share one computation
vec3 waves(vec2 uv, float t) {
  float h = 0.0, dx = 0.0, dy = 0.0;
  // a long swell rolling diagonally (the big gentle waves)
  vec2 d1 = normalize(vec2(0.8, 0.6));
  float p1 = dot(uv, d1) * 7.0 - t * 0.9;
  h += 0.030 * sin(p1); dx += 0.030 * cos(p1) * d1.x * 7.0; dy += 0.030 * cos(p1) * d1.y * 7.0;
  // a mid wave train crossing the other way
  vec2 d2 = normalize(vec2(-0.6, 0.8));
  float p2 = dot(uv, d2) * 16.0 - t * 1.6;
  h += 0.014 * sin(p2); dx += 0.014 * cos(p2) * d2.x * 16.0; dy += 0.014 * cos(p2) * d2.y * 16.0;
  // fine chop, warped by noise so it never reads as stripes
  float w = fbm(uv * 6.0 + t * 0.15) - 0.5;
  float p3 = (uv.y * 22.0 + uv.x * 8.0) - t * 2.6 + w * 3.0;
  float a3 = 0.003;
  h += a3 * sin(p3); dx += a3 * cos(p3) * 8.0; dy += a3 * cos(p3) * 22.0;
  return vec3(h, dx, dy);
}

// ---- the caustic net: the classic iterated sine warp (faithful formulation) ----
// The mod(...)-250 offset matters: it keeps the ratios large so the veins come out as a net
// instead of a uniform wash.
const float TAU6 = 6.2831853;
float caustic(vec2 uv, float t) {
  vec2 p = mod(uv * TAU6, TAU6) - 250.0;
  vec2 i = p;
  float c = 1.0;
  const float inten = 0.005;
  for (int n = 0; n < 4; n++) {
    float tt = t * (1.0 - (3.5 / float(n + 1)));
    i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / inten), p.y / (cos(i.y + tt) / inten)));
  }
  c /= 4.0;
  c = 1.17 - pow(c, 1.4);
  return clamp(pow(abs(c), 8.0), 0.0, 1.0);
}

// ---- one daisy, drawn as a polar SDF --------------------------------------------
// returns how much of the flower covers this pixel, plus the yolk mask
vec2 daisy(vec2 rel, float radius, float petals, float ph) {
  float d = length(rel);
  if (d > radius * 1.12) return vec2(0.0);
  float a = atan(rel.y, rel.x) + ph;
  // petal envelope: petals bumps around the rim, sharpened
  float env = pow(abs(cos(a * petals * 0.5)), 0.65);
  float rim = radius * (0.52 + 0.48 * env);
  float petal = smoothstep(rim, rim - radius * 0.16, d);        // soft outer edge
  petal *= smoothstep(radius * 0.30, radius * 0.42, d);         // gap around the yolk
  // a hint of shade on the petal base so petals read as separate
  float shade = smoothstep(radius * 0.62, radius * 0.36, d);
  float yolk = smoothstep(radius * 0.30, radius * 0.24, d);
  return vec2(petal, yolk) * vec2(1.0 - shade * 0.22, 1.0);
}

void main() {
  vec2 uv = gl_FragCoord.xy / R;
  vec2 suv = vec2(uv.x * (R.x / R.y), uv.y);    // aspect-corrected, y up (gl_FragCoord)
  float t = T;
  float top = 1.0 - uv.y;                        // 1 at the top of the screen

  vec3 hw = waves(vec2(suv.x, top), t);          // waves in screen orientation (y down = top)
  float h = hw.x, wx = hw.y, wy = hw.y;          // wy placeholder (unused below)

  // ---- base water: deep teal up top, clear light at the bottom, murky patches ----
  vec3 DEEP  = vec3(0.071, 0.220, 0.290);
  vec3 MID   = vec3(0.192, 0.439, 0.522);
  vec3 LIGHT = vec3(0.420, 0.700, 0.741);
  vec3 PALE  = vec3(0.722, 0.878, 0.878);
  float g = pow(top, 1.25);                       // 0 at top (deep) ... 1 at bottom (light)
  vec3 col = mix(DEEP, mix(MID, mix(LIGHT, PALE, smoothstep(0.55, 1.0, g)), smoothstep(0.15, 0.7, g)), smoothstep(0.0, 0.5, g));
  float murk = clamp((fbm(vec2(suv.x * 2.2, top * 2.4) + 3.7) - 0.46) * 2.6, 0.0, 1.0) * clamp(1.0 - top / 0.72, 0.0, 1.0);
  col = mix(col, DEEP * 0.85, murk * 0.75);

  // ---- the travelling waves: light from the upper left, slope brightens water ----
  float slope = hw.z;                             // dh/dy drives the visible shading
  col += vec3(0.10, 0.16, 0.15) * slope * 1.6 * (0.35 + 0.65 * g);
  col -= vec3(0.06, 0.10, 0.10) * max(0.0, -slope) * 0.45 * (0.35 + 0.65 * g);

  // ---- caustics, refracted through the wave field, strong in the clear water ----
  vec2 cuv = suv * 4.2 + vec2(hw.x, wx * 0.5) * 1.2;
  float caus = caustic(cuv + vec2(0.0, t * 0.02), t * 0.55);
  // fade the caustic lift where the base is already bright, or the clear water blows out white;
  // a broad slow mask gives the net calm patches and busy patches instead of uniform coverage
  float calm = 0.40 + 0.60 * smoothstep(0.30, 0.62, fbm(suv * 1.4 + vec2(t * 0.02, 0.0)) + 0.25 * g);
  float cmask = (0.22 + 0.78 * smoothstep(0.12, 0.62, top)) * (1.0 - murk * 0.8) * (1.0 - 0.45 * g) * calm;
  col += vec3(0.93, 0.99, 0.96) * caus * cmask * 0.60;

  // ---- glints: bright pixels where the wave surface tilts just right -------------
  vec2 gg = floor(gl_FragCoord.xy / DPR / 2.0);
  float glint = step(0.9955, hash(gg));
  float tw = pow(max(0.0, sin(t * (2.0 + 4.0 * hash(gg + 7.0)) + hash(gg) * 40.0)), 6.0);
  col += vec3(1.0, 1.0, 0.98) * glint * tw * (0.25 + 0.75 * smoothstep(0.2, 0.8, top)) * 0.8;

  // ---- ripple rings: expanding, fading, slightly flattened ------------------------
  for (int k = 0; k < 3; k++) {
    float fk = float(k);
    vec2 rc = vec2(0.28 + 0.33 * fk, 0.24 + 0.14 * sin(fk * 2.7));   // ring centres (uv)
    float ph = fract(t / 9.0 + fk * 0.37);
    float rr = 0.05 + ph * (0.30 - fk * 0.05);
    vec2 rel = (uv - rc) * vec2(R.x / R.y, 1.0);
    rel.y *= 1.28;                                                   // flattened: seen at an angle
    float dd = length(rel);
    float ring = exp(-pow(abs(dd - rr) * 140.0, 2.0)) * sin(3.14159 * ph);
    col += vec3(0.85, 0.97, 0.94) * ring * 0.18;
  }

  // ---- mouse disturbance: the cursor stirs the water around it ----------------------------
  // A patch of turbulence rides with the cursor: irregular bright/dark mottling (noise, not
  // rings) plus locally roughened caustics, while the agitation energy is high.
  if (uMou.z > 0.02) {
    vec2 mrel = (uv - uMou.xy) * vec2(R.x / R.y, 1.0);
    float md = length(mrel);
    // the patch is a soft irregular blob, not a circle: noise modulates its edge
    float blob = exp(-md * 10.0) * (0.5 + 0.5 * noise(uv * 16.0 + t * 1.4));
    float turb = blob * uMou.z;
    // stirred-up water: bright flecks and dark shadows at a fine scale, churning over time
    float churn = noise(uv * 22.0 + vec2(t * 2.6, -t * 2.0)) - noise(uv * 17.0 - vec2(t * 2.2, t * 1.5));
    col += vec3(0.90, 0.99, 0.96) * churn * turb * 2.0;
    col -= vec3(0.10, 0.14, 0.14) * turb * 0.25;   // the surface sinks slightly where stirred
    col += vec3(0.93, 0.99, 0.96) * caustic(uv * 10.0 + vec2(t * 1.4, t * 1.1), t * 2.2) * turb * 0.6;
  }

  // ---- the daisies: SDF, drifting and bobbing on the swell ------------------------
  vec4 FL[6];
  FL[0] = vec4(0.16, 0.24, 0.052, 0.0);
  FL[1] = vec4(0.46, 0.52, 0.040, 1.0);
  FL[2] = vec4(0.80, 0.30, 0.046, 2.0);
  FL[3] = vec4(0.30, 0.72, 0.056, 3.0);
  FL[4] = vec4(0.64, 0.82, 0.044, 4.0);
  FL[5] = vec4(0.90, 0.62, 0.036, 5.0);
  for (int i = 0; i < 6; i++) {
    vec4 F = FL[i];
    float fb = 1.0 + (t * 0.35 + F.w) ;
    vec2 fp = F.xy + vec2(sin(t * 0.22 + F.w * 1.7) * 0.012, cos(t * 0.31 + F.w * 2.3) * 0.008);
    // the bob: each flower rides its own swell phase
    float bob = 0.006 * sin(t * 0.8 + F.w * 2.1);
    vec2 rel = (uv - fp - vec2(0.0, -bob)) * vec2(R.x / R.y, 1.0);
    // the shadow sits a touch lower and does not bob with the flower
    vec2 srel = (uv - fp - vec2(0.006, -0.010)) * vec2(R.x / R.y, 1.0);
    float sd = length(srel / (F.z * 1.25));
    float shadow = smoothstep(1.0, 0.55, sd) * 0.18;
    col *= 1.0 - shadow * (0.5 + 0.5 * smoothstep(0.35, 0.85, 1.0 - top));
    vec2 df = daisy(rel / F.z, 1.0, 7.0, fb * 0.35);
    // petals: bright tip, cool base; yolk: warm dome
    vec3 petalCol = mix(vec3(0.80, 0.90, 0.93), vec3(1.0, 1.0, 0.99), df.x);
    col = mix(col, petalCol, clamp(df.x, 0.0, 1.0));
    vec3 yolkCol = mix(vec3(0.85, 0.60, 0.16), vec3(0.97, 0.79, 0.29), df.y);
    col = mix(col, yolkCol, clamp(df.y, 0.0, 1.0) * step(0.001, df.x + df.y));
    col += vec3(1.0, 0.95, 0.75) * smoothstep(0.35, 0.0, length(rel / (F.z * 0.35))) * 0.10;
  }

  gl_FragColor = vec4(col, 1.0);
}
`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s) || "shader compile failed");
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, "p");
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const uR = gl.getUniformLocation(prog, "R");
const uT = gl.getUniformLocation(prog, "T");
const uDPR = gl.getUniformLocation(prog, "DPR");
const uMou = gl.getUniformLocation(prog, "uMou");

// ---- mouse interaction ---------------------------------------------------------------------
// The app's shell polls the cursor (the wallpaper window itself never gets mouse events) and
// calls window.wallMouse(nx, ny) with the position normalised to the window, y DOWN, 0..1.
// Opening the file in a normal browser falls back to real mouse events. The cursor disturbs the
// water around it — a patch of turbulence (irregular bright/dark mottling, no rings, no trail)
// that rides with the cursor while it moves and settles once it rests. A click or a touch after
// a pause gives the patch a strong burst.
const mouse = { x: -9, y: -9, energy: 0, lastMove: -9 };
window.wallMouse = (nx, ny) => {
  nx = Math.min(1, Math.max(0, nx)); ny = Math.min(1, Math.max(0, ny));
  const dx = nx - mouse.x, dy = ny - mouse.y, d = Math.hypot(dx, dy);
  if (mouse.x < -1) { mouse.x = nx; mouse.y = ny; mouse.lastMove = t; return; }
  if (d < 0.0015) return;
  mouse.energy = Math.min(1, mouse.energy + d * 5);
  mouse.x = nx; mouse.y = ny; mouse.lastMove = t;
};
addEventListener("mousemove", (e) => {   // fallback: real browsers (the app shell calls wallMouse instead)
  if (window.__noMouseFallback) return;  // automated tests drive wallMouse directly
  window.wallMouse(e.clientX / innerWidth, e.clientY / innerHeight);
});
addEventListener("mousedown", (e) => {   // a click slaps the water: a strong burst of disturbance
  mouse.energy = 1;
  mouse.x = e.clientX / innerWidth; mouse.y = e.clientY / innerHeight;
});

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 1.5);   // perf redline: cap DPR
  cvs.width = Math.round(innerWidth * dpr);
  cvs.height = Math.round(innerHeight * dpr);
  gl.viewport(0, 0, cvs.width, cvs.height);
}
addEventListener("resize", resize);
resize();

const FRAME = 1000 / 30;                               // 30fps redline
let last = 0, t = 0, drew = 0;
let timeScale = 1;
window.wallSpeed = (v) => { timeScale = Math.min(5, Math.max(0.1, +v || 1)); };   // app speed knob
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) { frame.prev = 0; return; }     // pause when not visible
  if (now - last < FRAME) return;
  last = now;
  t += (now - (frame.prev || now)) / 1000 * timeScale;  // clock excludes hidden time, scaled
  frame.prev = now;
  gl.uniform2f(uR, cvs.width, cvs.height);
  gl.uniform1f(uT, t);
  gl.uniform1f(uDPR, Math.min(devicePixelRatio || 1, 1.5));
  gl.uniform3f(uMou, mouse.x, mouse.y, mouse.energy);
  mouse.energy *= 0.985;                 // the disturbance settles when the cursor rests
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  if (!drew) { drew = 1; dbg({ gl: "first draw done", w: cvs.width, h: cvs.height }); }
}
requestAnimationFrame(frame);

window.__wallTest = { ok: true, glError: null };
dbg({ ready: 1 });
</script>
</body>
</html>
