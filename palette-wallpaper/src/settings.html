<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palette Wallpaper</title>
<style>
  :root {
    --bg: #0d0c14; --panel: #15131f; --panel2: #1b1828; --line: #2a2540;
    --text: #e8e4f5; --dim: #9a93b5; --accent: #f53cd1; --accent2: #7c5cff; --ok: #4ade80;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.55 "Segoe UI", "Microsoft YaHei", "Yu Gothic UI", "Malgun Gothic", system-ui, sans-serif; }
  body { padding: 18px 20px 78px; user-select: none; max-width: 860px; }
  h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: .5px; }
  h1 b { color: var(--accent); }
  .sub { color: var(--dim); font-size: 11px; margin-bottom: 6px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--dim);
    margin: 16px 0 8px; font-weight: 600; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .card + .card { margin-top: 8px; }
  .row { display: flex; align-items: center; gap: 10px; margin: 8px 0; flex-wrap: wrap; }
  .row > label { flex: 0 0 88px; color: var(--dim); }
  select, input[type=text], input[type=number] {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 7px;
    padding: 6px 8px; font: inherit; outline: none; min-width: 0;
  }
  select:focus, input:focus { border-color: var(--accent2); }
  input[type=number] { width: 64px; }
  button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent2); }
  button.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: 0; font-weight: 600; color: #fff; }
  button.ghost { background: transparent; }
  button.tiny { padding: 3px 8px; font-size: 12px; }
  #pause { min-width: 62px; white-space: nowrap; }
  .slider { display: grid; grid-template-columns: 88px 1fr 54px; gap: 10px; align-items: center; margin: 7px 0; }
  .slider label { color: var(--dim); }
  .slider output { text-align: right; color: var(--accent); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .preview { position: relative; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: #000; max-width: 384px; }
  .preview canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
  .preview canvas.mirrored { transform: scaleX(-1); }
  .preview .tag { position: absolute; left: 8px; bottom: 6px; font-size: 11px; color: #cfc8e8;
    background: #000000a0; padding: 1px 7px; border-radius: 20px; }
  .side { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
  .side .info { font-size: 12px; color: var(--dim); }
  .hint { color: var(--dim); font-size: 11px; margin-top: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { border: 1px solid var(--line); background: var(--panel2); border-radius: 20px; padding: 3px 10px;
    font-size: 12px; cursor: pointer; color: var(--dim); }
  .chip.on { border-color: var(--accent); color: #fff; background: #f53cd120; }
  .rules { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .rule { display: grid; grid-template-columns: 96px 1fr 30px; gap: 8px; align-items: center; }
  .rule .x { color: var(--dim); background: none; border: 0; font-size: 15px; cursor: pointer; }
  .rule .x:hover { color: var(--accent); }
  .mine { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .mine:empty { display: none; }
  .mine .item { display: flex; align-items: center; gap: 8px; background: var(--panel2);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .mine .item .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mine .item.hiddenOne { opacity: 0.5; }
  .link { color: var(--accent2); }
  .link:hover { text-decoration: underline; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 20px; display: flex; gap: 10px;
    justify-content: flex-end; align-items: center; background: #0d0c14f2; border-top: 1px solid var(--line); }
  footer .grow { flex: 1; color: var(--dim); font-size: 12px; }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text); }
  .switch input { accent-color: var(--accent); width: 15px; height: 15px; }
  kbd { background: var(--panel2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
    padding: 0 5px; font: 11px/1.5 Consolas, monospace; }
  .saved { color: var(--ok); }
  .hidden { display: none !important; }
  .topbar { display: flex; align-items: flex-start; gap: 12px; }
  .topbar .titles { flex: 1; min-width: 0; }
  .topMenus { display: flex; align-items: center; gap: 8px; margin-top: 2px; flex: none; }
  .menu { position: relative; }
  .menuBtn { background: var(--panel2); border: 1px solid var(--line); color: var(--text);
    border-radius: 7px; padding: 6px 12px; font: inherit; cursor: pointer; white-space: nowrap; }
  .menuBtn:hover, .menu.open .menuBtn { border-color: var(--accent2); }
  .menuPanel { display: none; position: absolute; right: 0; top: calc(100% + 6px); width: 380px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
    z-index: 60; box-shadow: 0 10px 28px rgba(0, 0, 0, .5); }
  .menu.open .menuPanel { display: block; }
  #lang { width: 108px; flex: none; }
</style>
</head>
<body>
<div class="topbar">
  <div class="titles">
    <h1><span data-i18n="appName"></span></h1>
    <div class="sub" data-i18n="appSub"></div>
  </div>
  <div class="topMenus">
    <select id="lang"></select>
    <div class="menu" id="menuSettings">
      <button class="menuBtn" data-i18n="menuSettings"></button>
      <div class="menuPanel">
      <div class="row"><label data-i18n="hotkey"></label>
        <input id="hotkey" type="text" style="width:140px" placeholder="Ctrl+Alt+P">
        <span class="hint" style="margin:0" data-i18n="hotkeyHint"></span>
      </div>
      <div class="row" id="autoStartRow"><label data-i18n="autostart"></label>
        <label class="switch"><input type="checkbox" id="autoStart"> <span data-i18n="autostartHint"></span></label>
      </div>
      <div class="row"><label data-i18n="lockScreen"></label>
        <button id="setLock" class="tiny" data-i18n="lockBtn"></button>
        <span class="hint" style="margin:0" data-i18n="lockHint"></span>
      </div>
      <div class="row"><label data-i18n="dispMode"></label>
        <select id="dispMode" style="width:150px">
          <option value="fill"></option>
          <option value="contain"></option>
          <option value="cover"></option>
        </select>
      </div>
      <div class="row" id="dispAlignRow"><label data-i18n="dispAlign"></label>
        <select id="dispAlign" style="width:150px">
          <option value="center"></option>
          <option value="left"></option>
          <option value="right"></option>
          <option value="top"></option>
          <option value="bottom"></option>
        </select>
        <span class="hint" style="margin:0" data-i18n="dispAlignHint"></span>
      </div>
      <div class="row"><label data-i18n="reload"></label>
        <span style="color:var(--dim)" data-i18n="every"></span>
        <input id="reloadHours" type="number" min="0" max="48" step="1" style="width:64px">
        <span style="color:var(--dim)" data-i18n="reloadUnit"></span>
      </div>
      <div class="row" id="uninstallRow" style="margin-bottom:0"><label data-i18n="uninstall"></label>
        <button id="uninstall" class="tiny ghost" data-i18n="uninstallBtn"></button>
        <span class="hint" style="margin:0" data-i18n="trayHint"></span>
      </div>
      <div class="row hidden" id="storeRow" style="margin-bottom:0"><label></label>
        <span class="hint" style="margin:0" data-i18n="autostartStoreTask"></span>
      </div>
      </div>
    </div>
    <div class="menu" id="menuAbout">
      <button class="menuBtn" data-i18n="menuAbout"></button>
      <div class="menuPanel">
        <div class="hint" style="margin-top:0" data-i18n="aboutIntro"></div>
        <div class="row"><label data-i18n="verLabel"></label><span id="ver" style="color:var(--accent);font-variant-numeric:tabular-nums"></span><script>globalThis.__APP_VERSION__="__VER_TOKEN__";</script></div>
        <div class="row"><label data-i18n="archLabel"></label><span class="hint" style="margin:0" data-i18n="archValue"></span></div>
        <div class="row"><label data-i18n="licenseLabel"></label><span class="hint" style="margin:0" data-i18n="licenseValue"></span></div>
        <div class="row"><label data-i18n="contactLabel"></label>
          <span class="link" id="ghLink" style="cursor:pointer" data-i18n="githubLabel"></span>
          <span class="link" id="giteeLink" style="cursor:pointer" data-i18n="giteeLabel"></span>
        </div>
        <div class="hint" id="copyHint" style="margin:0 0 0 98px"></div>
        <div class="row">
          <button id="skillSave" class="tiny primary" data-i18n="skillSaveBtn"></button>
          <span class="hint" style="margin:0" data-i18n="skillHint"></span>
        </div>
        <div class="row" style="margin-top:6px">
          <button id="skillPrompt" class="tiny" data-i18n="skillPromptBtn"></button>
          <span class="hint" style="margin:0" data-i18n="skillPromptGuide"></span>
        </div>
        <div class="hint" id="promptHint" style="margin:0 0 0 98px"></div>
        <div class="row" style="margin-top:6px">
          <button id="cacheClear" class="tiny" data-i18n="cacheBtn"></button>
          <span class="hint" id="cacheHint" style="margin:0"></span>
        </div>
        <div class="hint" data-i18n="aboutSafe"></div>
      </div>
    </div>
  </div>
</div>

<h2 data-i18n="sceneTitle"></h2>
<div class="card">
  <div class="side">
    <div style="flex:1 1 300px; min-width: 260px">
      <div class="row" style="margin-top:0">
        <label data-i18n="currentEffect"></label>
        <select id="fx" style="flex:1"></select>
        <button id="pause" class="tiny"></button>
      </div>
      <div class="row" id="mineRow" style="margin-top:0">
        <label data-i18n="mineTitle"></label>
        <button id="importWallpaper" class="tiny primary" data-i18n="importWallpaper"></button>
        <button id="delWallpaper" class="tiny" data-i18n="deleteBtn"></button>
        <button id="restoreAll" class="tiny ghost" data-i18n="restoreAll"></button>
      </div>
      <div class="hint" id="mineHint" style="margin:0 0 4px 98px" data-i18n="importHint"></div>
      <div class="slider"><label data-i18n="speed"></label><input id="speed" type="range" min="0.2" max="3" step="0.1"><output id="speedV"></output></div>
      <div class="slider"><label data-i18n="fps"></label><input id="fps" type="range" min="15" max="60" step="15"><output id="fpsV"></output></div>
      <div class="hint" data-i18n="fpsHint"></div>
      <div class="row" style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px;margin-bottom:0">
        <label data-i18n="bg"></label>
        <select id="bg" style="width:150px">
          <option value="sky"></option>
          <option value="black"></option>
          <option value="ground"></option>
        </select>
      </div>
      <div class="row" style="margin-bottom:0">
        <label data-i18n="mirror"></label>
        <label class="switch"><input type="checkbox" id="mirror"> <span class="hint" style="margin:0" data-i18n="mirrorHint"></span></label>
      </div>
      <div class="row" style="margin-bottom:0">
        <label data-i18n="critters"></label>
        <label class="switch"><input type="checkbox" id="critters"> <span class="hint" style="margin:0" data-i18n="crittersHint"></span></label>
      </div>
    </div>
    <div>
      <div class="preview" id="pvBox"><canvas id="pv" width="320" height="180"></canvas><div id="pvPets" style="position:absolute;inset:0"></div><span class="tag" id="pvName"></span></div>
      <div class="info" style="margin-top:6px"><span id="st"></span></div>
    </div>
  </div>
</div>

<h2 data-i18n="paramsTitle"></h2>
<div class="card" id="params"></div>

<h2 data-i18n="petsTitle"></h2>
<div class="card">
  <div class="row" style="margin-top:0">
    <button id="importPet" class="tiny" data-i18n="importPet"></button>
  </div>
  <div class="hint" style="margin:0" data-i18n="petHint"></div>
  <div class="chips" id="petEnabled"></div>
  <div class="hint" id="petEnabledNote" style="margin:4px 0 0"></div>
  <div class="hint" style="margin:8px 0 0"><button id="petToggleAll" class="tiny ghost" style="border:0;color:var(--accent2);padding:0 4px"></button></div>
  <div class="chips" id="petAll" style="display:none"></div>
</div>

<h2 data-i18n="cycle"></h2>
<div class="card">
  <div class="row" style="margin-top:0">
    <label class="switch"><input type="checkbox" id="cycOn"> <span data-i18n="cycleOn"></span></label>
    <span style="color:var(--dim)" data-i18n="every"></span>
    <input id="cycMin" type="number" min="1" max="1440" step="1" style="width:70px">
    <span style="color:var(--dim)" data-i18n="cycleMinutes"></span>
  </div>
  <div class="row" style="margin-bottom:0">
    <button id="addRule" class="tiny" data-i18n="addRule"></button>
    <span class="hint" style="margin:0" data-i18n="rulesHint"></span>
  </div>
  <div class="rules" id="rules"></div>
</div>

<h2 data-i18n="paletteTitle"></h2>
<div class="card">
  <div class="row" style="margin-top:0">
    <button id="swap" class="primary tiny" data-i18n="swapBtn"></button>
    <span class="chip on" id="palCur"></span>
    <span class="hint"><span id="palToggle" class="link" style="cursor:pointer"></span></span>
  </div>
  <div class="chips" id="swatches" style="display:none"></div>
</div>

<footer>
  <span class="grow" id="msg" data-i18n="footerHint"></span>
  <button id="close" class="ghost" data-i18n="close"></button>
  <button id="save" class="primary" data-i18n="save"></button>
</footer>
<script type="module" src="settings.js"></script>
<input type="file" id="fileWallpaper" accept=".html,.htm,.mp4,.gif,.webm" hidden>
<input type="file" id="filePet" accept=".html,.htm" hidden>
</body>
</html>
