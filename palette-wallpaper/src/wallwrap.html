<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel Fantasia</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* the user's wallpaper page fills the screen; pet slots ride above it */
  #wall { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; z-index: 1; }
  .petSlot { position: absolute; width: 20vw; height: 20vw; transform: translate(-50%, -50%); pointer-events: none; z-index: 3; }
  .petSlot iframe { width: 100%; height: 100%; border: 0; display: block; background: transparent; }
</style>
</head>
<body>
<iframe id="wall" sandbox="allow-scripts"></iframe>
<div id="petSlots" style="position:fixed;inset:0;z-index:2;pointer-events:none"></div>
<script type="module" src="wallwrap.js"></script>
</body>
</html>
