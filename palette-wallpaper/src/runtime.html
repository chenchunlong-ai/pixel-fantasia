<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Pixel Fantasia</title>
<style>
  html, body { margin: 0; height: 100%; background: #15131d; overflow: hidden; }
  #fx { display: block; width: 100vw; height: 100vh; object-fit: fill;
        image-rendering: pixelated; image-rendering: crisp-edges; }
  .petSlot { position: absolute; width: 20vw; height: 20vw; transform: translate(-50%, -50%); pointer-events: none; z-index: 3; }
  .petSlot iframe { width: 100%; height: 100%; border: 0; display: block; background: transparent; }
</style>
</head>
<body>
<canvas id="fx" width="320" height="180"></canvas>
<script type="module" src="runtime.js"></script>
<div id="petSlots" style="position:fixed;inset:0;z-index:2;pointer-events:none"></div>
</body>
</html>
